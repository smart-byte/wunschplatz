name: Checks
on:
  pull_request:
  push:
    branches: [main]
  # The deploy workflow runs these checks before every release.
  workflow_call:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    # Playwright 1.60 cannot install Chromium on Ubuntu 26.04; unpin after upgrading Playwright.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - name: Count visits on wunschplatz.app only
        run: grep -q 'data-domains="wunschplatz.app"' dist/index.html
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failures
          path: test-results/
          retention-days: 7
